<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="80%">
      <stop offset="0" stop-color="#17697A"/>
      <stop offset="0.55" stop-color="#0C4250"/>
      <stop offset="1" stop-color="#05232A"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFEBB0" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#F5C96A" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#F5C96A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="skin" gradientUnits="userSpaceOnUse" x1="0" y1="40" x2="0" y2="420">
      <stop offset="0" stop-color="#FCEBCB"/>
      <stop offset="1" stop-color="#E8C48A"/>
    </linearGradient>
    <g id="hand">
      <!-- avuç -->
      <path d="M26 230 L204 230 L206 330 C206 385 172 418 118 418 C64 418 30 385 28 330 Z" fill="url(#skin)"/>
      <!-- parmaklar: serçe, yüzük, orta, işaret (aralarda ince boşluk) -->
      <rect x="26"  y="118" width="42" height="160" rx="21" fill="url(#skin)"/>
      <rect x="71"  y="62"  width="43" height="210" rx="21.5" fill="url(#skin)"/>
      <rect x="117" y="44"  width="43" height="226" rx="21.5" fill="url(#skin)"/>
      <rect x="163" y="78"  width="41" height="196" rx="20.5" fill="url(#skin)"/>
      <!-- başparmak (iç yanda, yukarı-içe) -->
      <g transform="rotate(34 196 372)">
        <rect x="174" y="236" width="46" height="140" rx="23" fill="url(#skin)"/>
      </g>
      <!-- avuç çizgileri -->
      <g stroke="#C79450" stroke-linecap="round" fill="none" opacity="0.55">
        <path d="M50 300 C90 328 140 326 176 292" stroke-width="6"/>
        <path d="M70 350 C100 366 132 364 156 346" stroke-width="5"/>
      </g>
      <!-- yen -->
      <rect x="18" y="404" width="198" height="72" rx="24" fill="#D9A441"/>
      <rect x="18" y="404" width="198" height="18" rx="9" fill="#F3CB72"/>
    </g>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <circle cx="512" cy="320" r="310" fill="url(#glow)"/>
  <path d="M500 160 a80 80 0 1 0 60 138 a62 62 0 1 1 -60 -138 Z" fill="#FFF4D6"/>
  <path d="M598 206 l9 22 24 2 -18 15 6 23 -21 -13 -21 13 6 -23 -18 -15 24 -2 Z" fill="#FFF4D6"/>
  <g transform="translate(254 410) rotate(-12 118 418)"><use href="#hand"/></g>
  <g transform="translate(770 410) scale(-1 1) rotate(-12 118 418)"><use href="#hand"/></g>
</svg>
